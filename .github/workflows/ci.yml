name: CI Pipeline

# WHEN to run this workflow
on:
  push:
    branches: [main, master]      # Run on pushes to main/master
  pull_request:
    branches: [main, master]      # Run on PRs targeting main/master

jobs:
  # Job 1: Run tests
  test:
    runs-on: ubuntu-latest        # Use a fresh Ubuntu VM
    
    steps:
      # Clone the repo into the VM (VM starts empty)
      - name: Checkout code
        uses: actions/checkout@v4
      
      # Install Python 3.9 on the VM
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: 'pip'            # Cache pip packages for faster runs
      
      # Install project dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      # Run pytest
      - name: Run tests
        run: |
          python -m pytest tests/ -v --tb=short
      
      # Quick check that data validation works
      - name: Run data validation (smoke test)
        run: |
          python -c "
          from src.ingest import validate_data_simple
          # Validate train data
          df = validate_data_simple('data/raw/train.csv', verbose=True)
          print(f'Train data validated: {len(df)} rows')
          "

  lint:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      
      - name: Install linting tools
        run: |
          pip install flake8 black isort
      
      - name: Check code formatting (black)
        run: |
          black --check --diff src/ tests/
        continue-on-error: true
      
      - name: Check import sorting (isort)
        run: |
          isort --check-only --diff src/ tests/
        continue-on-error: true
      
      - name: Lint with flake8
        run: |
          # Stop on syntax errors or undefined names
          flake8 src/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics
          # Warn on other issues (non-blocking)
          flake8 src/ tests/ --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics

  validate-features:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Validate feature pipeline
        run: |
          python -c "
          import pandas as pd
          from src.features import create_feature_pipeline, FEATURE_COLUMNS, BLOCKED_FEATURES, LEAKAGE_FEATURES
          
          # Check governance: no blocked or leakage features
          print('Checking feature governance...')
          for blocked in BLOCKED_FEATURES:
              assert blocked not in FEATURE_COLUMNS, f'Blocked feature {blocked} in pipeline!'
          for leakage in LEAKAGE_FEATURES:
              assert leakage not in FEATURE_COLUMNS, f'Leakage feature {leakage} in pipeline!'
          print('✓ No blocked or leakage features in pipeline')
          
          # Test pipeline can transform data
          df = pd.read_csv('data/raw/train.csv')
          pipeline = create_feature_pipeline()
          X = df[FEATURE_COLUMNS]
          X_transformed = pipeline.fit_transform(X)
          print(f'✓ Pipeline transforms {X.shape} -> {X_transformed.shape}')
          "
